<!DOCTYPE html>
<html>
<head>
  <title>Nearby Technicians</title>
</head>
<body>
  <header>
    <h1><a href="/">Nearby Technicians</a></h1>
    {% if user.is_authenticated %}
      <p>Hi {{ user.username }}! <a href="{% url 'logout' %}">Log Out</a></p>
    {% else %}
      <p><a href="{% url 'login' %}">Log In</a> or <a href="{% url 'signup' %}">Sign Up</a></p>
    {% endif %}
  </header>
  <main>
    {% block content %}
    {% endblock %}
  </main>
</body>
</html>
